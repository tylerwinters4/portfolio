<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyler Winters</title>
<meta name="description" content="Tyler Winters: engineer. Resume, projects, and contact.">
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --muted: #555555;
    --folder: #0000ee;
    --file: #008000;
    --rule: #cccccc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --folder: #6c8cff;
      --file: #4ade80;
      --rule: #333333;
    }
  }

  * { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    margin: 0;
    padding: 28px 18px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 16px;
    line-height: 1.5;
    max-width: 780px;
  }

  pre {
    margin: 0;
    font: inherit;
    white-space: pre;
    overflow-x: auto;
  }

  a { text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--folder);
    outline-offset: 2px;
  }

  .root { font-weight: 700; }
  .dir { color: var(--folder); }
  .file { color: var(--file); }
  .muted { color: var(--muted); }

  /* "terminal" header on file pages */
  .prompt { color: var(--muted); margin: 0 0 20px; overflow-wrap: anywhere; }
  .prompt b { color: var(--text); font-weight: 700; }

  .doc { white-space: normal; }
  .doc h2 {
    font-size: 1em;
    font-weight: 700;
    margin: 28px 0 6px;
  }
  .doc h2:first-child { margin-top: 0; }
  .doc p { margin: 0 0 12px; max-width: 70ch; }
  .doc ul { margin: 0 0 12px; padding-left: 2ch; list-style: none; max-width: 70ch; }
  .doc li { margin-bottom: 4px; text-indent: -2ch; padding-left: 2ch; }
  .doc li::before { content: "- "; color: var(--muted); }
  .doc hr { border: 0; border-top: 1px dashed var(--rule); margin: 22px 0; }
  .doc a { color: var(--folder); text-decoration: underline; }
  .doc .entry-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 16px; font-weight: 700; margin-bottom: 4px; }
  .doc .entry-head span:last-child { font-weight: 400; color: var(--muted); }

  .back { display: inline-block; margin-top: 36px; color: var(--folder); }

  /* contact form */
  form { max-width: 560px; margin-top: 18px; }
  label { display: block; margin: 14px 0 4px; font-weight: 700; }
  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--text);
    border-radius: 0;
    padding: 8px 10px;
  }
  textarea { min-height: 150px; resize: vertical; }
  button {
    margin-top: 16px;
    font: inherit;
    font-weight: 700;
    color: var(--bg);
    background: var(--text);
    border: 1px solid var(--text);
    border-radius: 0;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:hover { background: var(--bg); color: var(--text); }
  .note { color: var(--muted); font-size: 0.9em; margin-top: 12px; max-width: 60ch; }

  @media (max-width: 480px) {
    body { font-size: 15px; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ==========================================================
   EDIT THIS SECTION: your details live here
   ========================================================== */
const SITE = {
  name: "Tyler Winters",
  email: "winters.ty@northeastern.edu",
  github: "https://github.com/tylerwinters4",
  linkedin: "https://linkedin.com/in/tylerwinters4",
  location: "Boston, MA",
  resumePdf: "resume.pdf"                      // drop a PDF named this in the repo, or delete the link below
};

/* ==========================================================
   CONTENT: each folder holds files; each file is a function
   that returns HTML. Add or remove entries freely and the
   tree rebuilds itself.
   ========================================================== */
const FOLDERS = [
  {
    dir: "about me",
    files: [
      {
        name: "intro.txt",
        render: () => `
          <div class="doc">

            <h2>tools i use</h2>
            <ul>

            </ul>

            <ul>
              <li><a href="${SITE.github}">github</a></li>
              <li><a href="${SITE.linkedin}">linkedin</a></li>
              <li><a href="#/contact/email_me.txt">email me</a></li>
            </ul>
          </div>`
      },
      {
        name: "education.txt",
        render: () => `
          <div class="doc">
            <div class="entry-head"><span>Northeastern University</span><span>expected May 2029</span></div>
            <p class="muted">B.S. Mechanical Engineering · Boston, MA · GPA 3.91</p>
            <h2>relevant coursework</h2>
            <ul>
              <li>Thermodynamics</li>
              <li>Fluid Mechanics (in progress)</li>
              <li>Mechanics of Materials (in progress)</li>
              <li>Statics</li>
              <li>Differential Equations</li>
              <li>Engineering Cornerstone</li>
            </ul>
          </div>`
      }
    ]
  },
  {
    dir: "resume",
    files: [
      // opens the PDF directly in a new tab (no page in between)
      { name: "resume.pdf", href: SITE.resumePdf }
    ]
  },
  {
    dir: "projects",
    files: [
      {
        name: "quadruped_robot.txt",
        render: () => `
          <div class="doc">
            <div class="entry-head"><span>quadruped walking robot</span><span>Sept 2026 – present</span></div>
            <p class="muted">3-person team · stack: SolidWorks, Arduino, C++</p>
            <p>A four-legged robot that walks using a controller and servo motors built into its legs and body. It also has a screen that displays text and designs based on the action the robot is performing. I designed the legs and am currently working on the body.</p>
            <ul>
              <li>Designed the motorized legs in SolidWorks</li>
              <li>Programmed servo motor orientations to move the legs</li>
            </ul>
          </div>`
      },
      {
        name: "volleyball_dispenser.txt",
        render: () => `
          <div class="doc">
            <div class="entry-head"><span>automatic volleyball dispenser</span><span>June – Aug 2026</span></div>
            <p class="muted">personal project · stack: Arduino, PVC piping</p>
            <p>A fully automatic ball dispenser: a sensor detects when a ball is needed and a motorized system feeds the next one through a PVC pipe structure.</p>

            </ul>

      },
      {
        name: "everglades_hide_and_seek.txt",
        render: () => `
          <div class="doc">
            <div class="entry-head"><span>everglades 3D hide and seek game</span><span>Jan – May 2026</span></div>
            <p class="muted">cornerstone group project · stack: AutoCAD, 3D printing, Raspberry Pi</p>
            <p>An interactive replica of the Everglades where kids search for hidden animals, exhibited at the Boston Children’s Museum.</p>
            <ul>
              <li>Modeled a 3-layer cardboard and papier-mâché replica of the Everglades in AutoCAD</li>
              <li>Presented the exhibit to 28 children at the Boston Children’s Museum</li>
              <li>3D-printed 22 animals and hid them throughout the structure for the children to find</li>
              <li>Created rock formations, painted the model, added grass, and designed a water-themed marble run for interactivity</li>
              <li>Programmed and wired an interior lighting system using Raspberry Pi firmware and LED strips</li>
            </ul>

      },
      {
        name: "force_transport_system.txt",
        render: () => `
          <div class="doc">
            <div class="entry-head"><span>force transport system</span><span>Sept – Dec 2025</span></div>

      },

  },
  {
    dir: "contact",
    files: [
      {
        name: "email_me.txt",
        render: () => `
          <div class="doc">

            <form id="mailform" novalidate>
              <label for="f-name">your name</label>
              <input id="f-name" name="name" type="text" autocomplete="name" required>

              <label for="f-email">your email</label>
              <input id="f-email" name="email" type="email" autocomplete="email" required>

              <label for="f-subject">subject</label>
              <input id="f-subject" name="subject" type="text">

              <label for="f-message">message</label>
              <textarea id="f-message" name="message" required></textarea>

              <button type="submit">open in email app</button>
              <p class="note" id="form-status" role="status">This opens a pre-filled message in your email app. Nothing is sent until you press send there.</p>

        after: () => {
          const form = document.getElementById("mailform");
          const status = document.getElementById("form-status");

            e.preventDefault();
            const name = form.name.value.trim();
            const from = form.email.value.trim();

              status.textContent = "Fill in your name, email, and message first.";

            const body = message + "\n\n" + name + "\n" + from;
            window.location.href =
              "mailto:" + SITE.email +
              "?subject=" + encodeURIComponent(subject) +
              "&body=" + encodeURIComponent(body);

];

/* ==========================================================
   ENGINE: draws the tree and shows files. No need to edit.
   ========================================================== */
const app = document.getElementById("app");

function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderTree() {
  document.title = SITE.name;
  let out = `<span class="root">${esc(SITE.name)}</span>\n`;
  FOLDERS.forEach((folder, i) => {
    const lastFolder = i === FOLDERS.length - 1;
    out += `${lastFolder ? "└── " : "├── "}<span class="dir">${esc(folder.dir)}</span>\n`;
    folder.files.forEach((file, j) => {
      const lastFile = j === folder.files.length - 1;
      const trunk = lastFolder ? "    " : "│   ";
      const link = file.href
        ? `<a class="file" href="${file.href}" target="_blank" rel="noopener">${esc(file.name)}</a>`
        : `<a class="file" href="#/${encodeURIComponent(folder.dir)}/${encodeURIComponent(file.name)}">${esc(file.name)}</a>`;
      out += `${trunk}${lastFile ? "└── " : "├── "}${link}\n`;
    });
  });
  app.innerHTML = `<pre aria-label="site directory">${out}</pre>`;
}

function renderFile(dirName, fileName) {
  const folder = FOLDERS.find((f) => f.dir === dirName);
  const file = folder && folder.files.find((f) => f.name === fileName);
  if (!file) { renderTree(); return; }
  document.title = `${fileName} | ${SITE.name}`;
  app.innerHTML = `
    <p class="prompt">~/${esc(dirName)}$ <b>cat ${esc(fileName)}</b></p>
    ${file.render()}
    <a class="back" href="#/">cd ..</a>`;
  if (file.after) file.after();
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts.length === 2) renderFile(decodeURIComponent(parts[0]), decodeURIComponent(parts[1]));
  else renderTree();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
